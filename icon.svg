<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5DF6"/>
      <stop offset="1" stop-color="#9D4EDD"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="256" rx="112" fill="url(#sheen)"/>

  <!-- shield -->
  <path d="M256 86 L386 132 V268 C386 344 330 396 256 426 C182 396 126 344 126 268 V132 Z"
        fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-width="18"
        stroke-linejoin="round"/>

  <!-- play triangle -->
  <path d="M226 196 L226 312 L320 254 Z" fill="#ffffff" stroke="#ffffff"
        stroke-width="14" stroke-linejoin="round"/>

  <!-- time badge (clock) -->
  <circle cx="374" cy="392" r="62" fill="#ffffff" stroke="#6D5DF6" stroke-width="8"/>
  <g stroke="#6D5DF6" stroke-width="12" stroke-linecap="round">
    <line x1="374" y1="392" x2="374" y2="356"/>
    <line x1="374" y1="392" x2="402" y2="404"/>
  </g>
  <circle cx="374" cy="392" r="7" fill="#6D5DF6"/>
</svg>
